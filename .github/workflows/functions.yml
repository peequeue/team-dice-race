name: Deploy server functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Read project ref
        run: |
          REF="${{ vars.SUPABASE_PROJECT_REF }}"
          [ -n "$REF" ] || REF=$(tr -d ' \n' < supabase/project-ref 2>/dev/null || true)
          echo "REF=$REF" >> "$GITHUB_ENV"
      - run: supabase functions deploy --project-ref "$REF" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
