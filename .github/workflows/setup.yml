name: Set up Supabase
# One click does the whole server setup: database tables, the hourly 4pm job,
# its shared secret, the function settings and the three server functions.
# Safe to run again: existing tables are kept and the cron secret is refreshed in both places.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/project-ref', 'supabase/migrations/**', '.github/workflows/setup.yml']

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ADMIN_BOOTSTRAP_TOKEN: ${{ secrets.ADMIN_BOOTSTRAP_TOKEN }}
      ORIGIN: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Read project ref
        run: |
          REF="${{ vars.SUPABASE_PROJECT_REF }}"
          [ -n "$REF" ] || REF=$(tr -d ' \n' < supabase/project-ref 2>/dev/null || true)
          echo "REF=$REF" >> "$GITHUB_ENV"

      - name: Check settings
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN (secret)"
          [ -n "$ADMIN_BOOTSTRAP_TOKEN" ] || missing="$missing ADMIN_BOOTSTRAP_TOKEN (secret)"
          [ -n "$REF" ] || missing="$missing project ref (supabase/project-ref)"
          if [ -n "$missing" ]; then echo "::error::Missing in Settings > Secrets and variables > Actions:$missing"; exit 1; fi

      - name: Database tables
        run: |
          q() { jq -n --rawfile q "$1" '{query: $q}' | curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @-; echo; }
          echo "select to_regclass('public.seasons') is not null as present;" > /tmp/check.sql
          if q /tmp/check.sql | grep -q '"present":true'; then
            echo "Tables already there, keeping them."
          else
            q supabase/migrations/0001_init.sql
          fi

      - name: Hourly 4pm job and its secret
        run: |
          CRON_SECRET=$(openssl rand -hex 24)
          echo "::add-mask::$CRON_SECRET"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"
          q() { jq -n --rawfile q "$1" '{query: $q}' | curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
                  -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @- > /dev/null; }
          cat > /tmp/vault.sql <<SQL
          do \$\$
          declare v_id uuid;
          begin
            select id into v_id from vault.secrets where name = 'project_url';
            if v_id is null then perform vault.create_secret('https://$REF.supabase.co', 'project_url');
            else perform vault.update_secret(v_id, 'https://$REF.supabase.co'); end if;
            select id into v_id from vault.secrets where name = 'cron_secret';
            if v_id is null then perform vault.create_secret('$CRON_SECRET', 'cron_secret');
            else perform vault.update_secret(v_id, '$CRON_SECRET'); end if;
          end \$\$;
          SQL
          q /tmp/vault.sql
          q supabase/migrations/0002_cron.sql
          echo "Vault and hourly job set."

      - name: Function settings
        run: |
          supabase secrets set --yes --project-ref "$REF" \
            "CRON_SECRET=$CRON_SECRET" "ADMIN_BOOTSTRAP_TOKEN=$ADMIN_BOOTSTRAP_TOKEN" "ALLOWED_ORIGIN=$ORIGIN"

      - name: Server functions
        run: supabase functions deploy --yes --project-ref "$REF" --use-api
